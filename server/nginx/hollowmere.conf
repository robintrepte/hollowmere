# Hollowmere nginx site. Copy to /etc/nginx/sites-available/hollowmere
# after replacing every __PLACEHOLDER__.
#
# Placeholders:
#   __DOMAIN__     public hostname, e.g. play.example.com
#   __SITE_DIR__   exported web build, e.g. /srv/hollowmere/site
#   __NAKAMA__     Nakama HTTP, e.g. 127.0.0.1:7350
#
# TLS is added later by: certbot --nginx -d __DOMAIN__

server {
	listen 80;
	listen [::]:80;
	server_name __DOMAIN__;

	# Let's Encrypt HTTP-01 (certbot writes into this location).
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		default_type "text/plain";
	}

	# Nakama API + realtime socket share the game origin (no CORS).
	# Do not gzip the proxy: Godot's HTTPRequest would inflate twice.
	location /v2/ {
		proxy_pass http://__NAKAMA__;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 3600s;
	}

	location /ws {
		proxy_pass http://__NAKAMA__;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 3600s;
	}

	location = /healthcheck {
		proxy_pass http://__NAKAMA__/healthcheck;
		proxy_set_header Host $host;
		proxy_set_header Accept-Encoding "";
	}

	# Godot web build. Fingerprinted engine files (hm-<hash>.*) never change
	# under a name, so they can be cached forever. Everything else revalidates.
	root __SITE_DIR__;
	index index.html;

	location /hm- {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		gzip_static on;
		# Uncomment after: apt install libnginx-mod-http-brotli
		# brotli_static on;
		try_files $uri =404;
	}

	# /privacy and /terms are real files (privacy/index.html, terms/index.html),
	# copied into the web build by tools/release/fingerprint_web.sh.
	location / {
		expires -1;
		add_header Cache-Control "no-cache";
		gzip_static on;
		# brotli_static on;
		try_files $uri $uri/ /index.html;
	}
}

# MCP relay (docker compose publishes 127.0.0.1:8787). TLS via:
#   certbot --nginx -d mcp.__DOMAIN__
server {
	listen 80;
	listen [::]:80;
	server_name mcp.__DOMAIN__;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		default_type "text/plain";
	}

	location / {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Authorization $http_authorization;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
		proxy_buffering off;
	}
}
