# OPTIONAL extra Nakama settings for this server (server/nakama/local.yml, chmod 600, never committed).
# Not needed for a normal setup: the database address, every key and the Tretu settings come from
# server/.env (see server/.env.example) and server/nakama/run.mjs passes them to Nakama as flags.
# Use this file only for other Nakama options, e.g. a different log level:
#
# logger:
#   level: "DEBUG"
#
# Values from server/.env win over this file. Do not put secrets here; run.mjs only reads them
# from the environment (it refuses to start while they are missing there).
