# hollowmere.tretu.de: Godot web build (static) + Nakama API/realtime (PM2 "hollowmere-nakama").
#   sudo cp deploy/nginx/hollowmere.tretu.de.conf /etc/nginx/sites-available/hollowmere.tretu.de.conf
#   sudo ln -sfn ../sites-available/hollowmere.tretu.de.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hollowmere.tretu.de --redirect      (adds TLS on 443 to this file)
#
# Web build directory: /var/www/hollowmere (CI "deploy-web" rsyncs build/web/ there).
# Headers: the export is single-threaded, so it needs no cross-origin isolation. Do NOT add
# Cross-Origin-Embedder-Policy (blocks Google sign-in) or Cross-Origin-Opener-Policy: same-origin
# (cuts the sign-in popups off from the game page).
# nginx only inherits add_header from the server block into locations that set none of their own,
# so every location with its own add_header repeats the security headers.

# Sign-in endpoints: 30 per minute per IP with a burst of 30 (a LAN party signing in at once fits;
# password guessing does not). The zone is shared by this site only.
limit_req_zone $binary_remote_addr zone=hollowmere_auth:10m rate=30r/m;

server {
	listen 80;
	listen [::]:80;
	server_name hollowmere.tretu.de;

	# Let's Encrypt HTTP-01 (certbot writes into this location).
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		default_type "text/plain";
	}

	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	# Only sent over HTTPS by browsers (after certbot adds TLS to this server block).
	add_header Strict-Transport-Security "max-age=31536000" always;

	# Account sign-in / sign-up (email, device, custom = Tretu-Konto / Discord, Google, Apple):
	# rate-limited, otherwise the same as /v2/ below.
	location ^~ /v2/account/authenticate/ {
		limit_req zone=hollowmere_auth burst=30 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:7350;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 30s;
		client_max_body_size 64k;
	}

	# Nakama API + realtime socket share the game origin (no CORS).
	# Do not gzip the proxy: Godot's HTTPRequest would inflate twice.
	location /v2/ {
		proxy_pass http://127.0.0.1:7350;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 3600s;
		client_max_body_size 8m;
	}

	location /ws {
		proxy_pass http://127.0.0.1:7350;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 3600s;
	}

	# Nakama's own liveness check (empty JSON, 200 while the process is up).
	location = /healthcheck {
		proxy_pass http://127.0.0.1:7350/healthcheck;
		proxy_set_header Host $host;
		proxy_set_header Accept-Encoding "";
	}

	# Contract health: {"status":"ok","app":"hollowmere",...,"checks":{"nakama","db"}}, 503 on failure.
	# Served by the MCP relay (PM2 "hollowmere-mcp"), which asks Nakama's health RPC (incl. a DB query).
	location = /api/health {
		proxy_pass http://127.0.0.1:8787/api/health;
		proxy_set_header Host $host;
		proxy_read_timeout 10s;
		add_header Cache-Control "no-store" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
	}

	# Legal pages live on tretu.de.
	location ~ ^/(privacy|datenschutz)/?$ { return 308 https://tretu.de/datenschutz; }
	location ~ ^/(terms|agb)/?$ { return 308 https://tretu.de/agb; }
	location ~ ^/impressum/?$ { return 308 https://tretu.de/impressum; }

	# Tretu-Konto sign-in callback (static page, carries a one-time code in the query).
	location = /auth/callback {
		root /var/www/hollowmere;
		try_files /auth/callback/index.html =404;
		default_type text/html;
		add_header Cache-Control "no-store" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
	}

	root /var/www/hollowmere;
	index index.html;

	# Fingerprinted engine files (hm-<hash>.*) never change under a name: cache forever.
	location /hm- {
		types {
			application/wasm wasm;
			text/javascript js;
			application/octet-stream pck;
		}
		default_type application/octet-stream;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		gzip_static on;
		# Uncomment after: apt install libnginx-mod-http-brotli-static
		# brotli_static on;
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		# The game (and its sign-in popups) must not be framed by other sites.
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		gzip_static on;
		# brotli_static on;
		try_files $uri $uri/ /index.html;
	}
}
