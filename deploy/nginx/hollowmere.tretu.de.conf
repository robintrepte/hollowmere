# hollowmere.tretu.de: Godot web build (static) + Nakama API/realtime (PM2 "hollowmere-nakama")
# + health and the Tretu platform webhook (PM2 "hollowmere-mcp", 127.0.0.1:8787). HOSTING.md step 7:
#   sudo certbot certonly --webroot -w /var/www/html -d hollowmere.tretu.de     (first time, see HOSTING.md)
#   sudo cp deploy/nginx/hollowmere.tretu.de.conf /etc/nginx/sites-available/hollowmere.tretu.de.conf
#   sudo ln -sfn ../sites-available/hollowmere.tretu.de.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# This file is complete (TLS included): do not run "certbot --nginx" on it; renewals use the webroot.
#
# Web root: ONLY the web build, /var/www/hollowmere/site (CI "deploy-web" rsyncs build/web/ there,
# HOSTING.md SITE_DIR). Never point root at a git checkout or a directory that holds .env /
# local.yml: the checkout lives in /srv/hollowmere (APP_DIR). Dotfiles are refused anyway.
# Headers: the export is single-threaded, so it needs no cross-origin isolation. Do NOT add
# Cross-Origin-Opener-Policy: same-origin (cuts the Tretu sign-in popup off from the game page).
# nginx only inherits add_header from the server block into locations that set none of their own,
# so every location with its own add_header repeats the security headers.

# Sign-in endpoints: 30 per minute per IP with a burst of 30 (a LAN party signing in at once fits;
# token guessing does not). The zone is shared by this site only.
limit_req_zone $binary_remote_addr zone=hollowmere_auth:10m rate=30r/m;
# Platform webhook (tretu.de's worker): generous, it retries on 429/5xx anyway.
limit_req_zone $binary_remote_addr zone=hollowmere_webhook:1m rate=120r/m;

# Port 80: Let's Encrypt HTTP-01 (webroot) and a redirect to HTTPS, nothing else.
server {
	listen 80;
	listen [::]:80;
	server_name hollowmere.tretu.de;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		default_type "text/plain";
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	# HTTP/2 via `http2 on;` (nginx 1.25.1+; the `listen … http2` parameter is deprecated there).
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name hollowmere.tretu.de;

	ssl_certificate /etc/letsencrypt/live/hollowmere.tretu.de/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/hollowmere.tretu.de/privkey.pem;
	# Mozilla "intermediate" settings, as certbot ships them.
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /var/www/hollowmere/site;
	index index.html;

	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000" always;

	# Never serve dotfiles (.env, .git, …), even if one ends up in the web root by mistake.
	location ~ /\. {
		return 404;
	}

	# Account sign-in (custom = Tretu-Konto, device = guest) and "Save to Tretu-Konto" (link/custom):
	# rate-limited, otherwise the same as /v2/ below. A regex location wins over the /v2/ prefix.
	location ~ ^/v2/account/(authenticate|link)/ {
		limit_req zone=hollowmere_auth burst=30 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:7350;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 30s;
		client_max_body_size 64k;
	}

	# Nakama API + realtime socket share the game origin (no CORS).
	# Do not gzip the proxy: Godot's HTTPRequest would inflate twice.
	location /v2/ {
		proxy_pass http://127.0.0.1:7350;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 3600s;
		client_max_body_size 8m;
	}

	location /ws {
		proxy_pass http://127.0.0.1:7350;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 3600s;
	}

	# Nakama's own liveness check (empty JSON, 200 while the process is up).
	location = /healthcheck {
		proxy_pass http://127.0.0.1:7350/healthcheck;
		proxy_set_header Host $host;
		proxy_set_header Accept-Encoding "";
	}

	# Contract health: {"status":"ok","app":"hollowmere",...,"checks":{"nakama","db"}}, 503 on failure.
	# Served by the MCP relay (PM2 "hollowmere-mcp"), which asks Nakama's health RPC (incl. a DB query).
	location = /api/health {
		proxy_pass http://127.0.0.1:8787/api/health;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_read_timeout 10s;
		add_header Cache-Control "no-store" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
	}

	# Tretu platform webhook (user.deleted / user.updated), signed per contract §3 and checked by
	# hollowmere-mcp. POST only, small bodies; the original URI is passed on unchanged (it is signed).
	location = /api/tretu/webhook {
		if ($request_method != POST) {
			return 405;
		}
		limit_req zone=hollowmere_webhook burst=60 nodelay;
		limit_req_status 429;
		client_max_body_size 64k;
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 15s;
		add_header Cache-Control "no-store" always;
		add_header Allow "POST" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
	}

	# Legal pages live on tretu.de.
	location ~ ^/(privacy|datenschutz)/?$ { return 308 https://tretu.de/datenschutz; }
	location ~ ^/(terms|agb)/?$ { return 308 https://tretu.de/agb; }
	location ~ ^/impressum/?$ { return 308 https://tretu.de/impressum; }

	# Tretu-Konto sign-in callback (static page, carries a one-time code in the query).
	location = /auth/callback {
		try_files /auth/callback/index.html =404;
		default_type text/html;
		add_header Cache-Control "no-store" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
	}

	# Fingerprinted engine files (hm-<hash>.*) never change under a name: cache forever.
	location /hm- {
		types {
			application/wasm wasm;
			text/javascript js;
			application/octet-stream pck;
		}
		default_type application/octet-stream;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		gzip_static on;
		# Uncomment after: apt install libnginx-mod-http-brotli-static
		# brotli_static on;
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		# The game (and its sign-in popups) must not be framed by other sites.
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		gzip_static on;
		# brotli_static on;
		try_files $uri $uri/ /index.html;
	}
}
