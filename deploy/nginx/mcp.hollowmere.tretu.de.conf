# mcp.hollowmere.tretu.de: MCP relay for AI helpers (PM2 "hollowmere-mcp", 127.0.0.1:8787).
#   sudo cp deploy/nginx/mcp.hollowmere.tretu.de.conf /etc/nginx/sites-available/mcp.hollowmere.tretu.de.conf
#   sudo ln -sfn ../sites-available/mcp.hollowmere.tretu.de.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp.hollowmere.tretu.de --redirect

server {
	listen 80;
	listen [::]:80;
	server_name mcp.hollowmere.tretu.de;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		default_type "text/plain";
	}

	location / {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Authorization $http_authorization;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
		# Streamable HTTP / SSE: pass events through as they come.
		proxy_buffering off;
	}
}
