name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path game --import || true
      - name: Compile all scripts
        run: godot --headless --path game res://tests/check_scripts.tscn
      - name: Unit tests
        run: godot --headless --path game -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gjunit_xml_file=res://../test-results.xml
      - name: Translation template is current
        run: python3 tools/content/extract_strings.py --check
      - name: Balance simulation
        run: godot --headless --path game res://tests/sim/balance_sim.tscn -- --days=112
      - name: Start Nakama
        run: |
          docker compose -f server/docker-compose.yml up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7350/healthcheck && break; sleep 2; done
      - name: Server integration test
        run: godot --headless --path game res://tests/net/server_test.tscn -- --require-server
      - name: Co-op network test
        run: godot --headless --path game res://tests/net/net_test.tscn
      - name: Desync test (host + 3 clients)
        run: godot --headless --path game res://tests/net/desync_test.tscn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  export:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: ["Windows Desktop", "macOS", "Web"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/
      - name: Import
        run: godot --headless --path game --import || true
      - name: Point release builds at the live server
        if: vars.HOLLOWMERE_DOMAIN != ''
        run: sed -i "s/%HOLLOWMERE_DOMAIN%/${{ vars.HOLLOWMERE_DOMAIN }}/" game/project.godot
      - name: Export
        run: |
          mkdir -p build/windows build/macos build/web
          godot --headless --path game --export-release "${{ matrix.preset }}"
      - name: Inject OAuth client ids (web)
        if: matrix.preset == 'Web'
        run: |
          sed -i "s/%GOOGLE_CLIENT_ID%/${{ secrets.GOOGLE_CLIENT_ID }}/" build/web/index.html
          sed -i "s/%APPLE_CLIENT_ID%/${{ secrets.APPLE_CLIENT_ID }}/" build/web/index.html
          sed -i "s/%DISCORD_CLIENT_ID%/${{ secrets.DISCORD_CLIENT_ID }}/" build/web/index.html
      - name: Fingerprint and precompress (web)
        if: matrix.preset == 'Web'
        run: |
          sudo apt-get install -y -qq brotli
          tools/release/fingerprint_web.sh build/web
          tools/release/precompress_web.sh build/web
      - name: Web download budget (< 50 MB)
        if: matrix.preset == 'Web'
        run: |
          total=$(cat build/web/*.br | wc -c)
          echo "Compressed download: $((total / 1048576)) MB"
          test "$total" -lt 52428800
      - uses: actions/upload-artifact@v4
        with:
          name: hollowmere-${{ matrix.preset == 'Windows Desktop' && 'windows' || matrix.preset == 'macOS' && 'macos' || 'web' }}
          path: build/

  sign-macos:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hollowmere-macos
          path: dist
      - name: Sign and notarize
        if: env.MACOS_SIGN_IDENTITY != ''
        run: tools/release/sign_macos.sh dist/macos/Hollowmere.zip
      - name: Unsigned build (no Apple secrets yet)
        if: env.MACOS_SIGN_IDENTITY == ''
        run: echo "::warning::macOS build is unsigned; add the Apple secrets listed in RELEASE.md"
      - uses: actions/upload-artifact@v4
        with:
          name: hollowmere-macos-release
          path: dist/macos/Hollowmere.zip

  itch:
    needs: [export, sign-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hollowmere-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: hollowmere-macos-release
          path: dist/mac
      - name: Push playtest builds to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          version="${GITHUB_REF_NAME#v}"
          ./butler push dist/windows "$ITCH_TARGET:windows" --userversion "$version"
          ./butler push dist/mac/Hollowmere.zip "$ITCH_TARGET:mac" --userversion "$version"
      - name: Skipped (no itch secrets yet)
        if: env.BUTLER_API_KEY == '' || env.ITCH_TARGET == ''
        run: echo "::warning::Set BUTLER_API_KEY (secret) and ITCH_TARGET (variable, e.g. you/hollowmere) to publish to itch.io"

  deploy-web:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hollowmere-web
          path: site
      - name: Upload to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete site/web/ deploy@"$DEPLOY_HOST":/srv/hollowmere/site/
          rsync -az --exclude .env --exclude site/ server/ deploy@"$DEPLOY_HOST":/srv/hollowmere/
          # nginx (HOSTING.md) already owns 80/443. Do not start the Caddy profile here.
          ssh deploy@"$DEPLOY_HOST" "cd /srv/hollowmere && docker compose up -d --build"
