name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  # Official SHA-512 sums from the release's SHA512-SUMS.txt (HOSTING.md "Checksums").
  GODOT_LINUX_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
  GODOT_TEMPLATES_SHA512: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"
  NAKAMA_VERSION: "3.41.0"
  # Nakama publishes no checksum file: SHA-256 of the release tarball as pinned in HOSTING.md.
  NAKAMA_SHA256: "71aea14384b097e043917d0b1e8c3799594064acbab01853e71ea10d80624ce2"

jobs:
  test:
    runs-on: ubuntu-latest
    # The runner's Postgres is replaced by the same major version production uses (no Docker in
    # production; this is only the CI database for the Nakama tests).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          echo "${GODOT_LINUX_SHA512}  Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" | sha512sum -c -
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path game --import || true
      - name: Compile all scripts
        env:
          GODOT_OK: ", 0 failed"
        run: tools/ci/godot.sh --headless --path game res://tests/check_scripts.tscn
      - name: Unit tests
        env:
          GODOT_OK: "All tests passed"
        run: tools/ci/godot.sh --headless --path game -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gjunit_xml_file=res://../test-results.xml
      - name: Translation template is current
        run: python3 tools/content/extract_strings.py --check
      - name: Balance simulation
        env:
          GODOT_OK: "Sim finished.+OK"
        run: tools/ci/godot.sh --headless --path game res://tests/sim/balance_sim.tscn -- --days=112
      - name: Casino return-to-player simulation (1M rounds)
        env:
          GODOT_OK: "Casino sim.+OK"
        run: tools/ci/godot.sh --headless --path game res://tests/sim/casino_rtp.tscn -- --rounds=1000000
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: MCP relay self-test
        run: node server/mcp/test.mjs
      - name: Nakama runner (command line from the environment, production checks, redaction)
        run: node --test server/nakama/tests/run_test.mjs
      - name: nginx site file (nginx -t with dummy certificates, every location live)
        run: |
          sudo apt-get install -y -qq nginx
          deploy/nginx/test_site.sh
      - name: Install the Nakama release binary + Lua (Nakama runs as a plain binary, like production)
        run: |
          curl -fsSL -o nakama.tgz "https://github.com/heroiclabs/nakama/releases/download/v${NAKAMA_VERSION}/nakama-${NAKAMA_VERSION}-linux-amd64.tar.gz"
          echo "${NAKAMA_SHA256}  nakama.tgz" | sha256sum -c -
          mkdir -p .tools/nakama && tar -xzf nakama.tgz -C .tools/nakama
          bin=$(find .tools/nakama -type f -name nakama | head -1)
          chmod +x "$bin" && echo "NAKAMA_BIN=$PWD/$bin" >> "$GITHUB_ENV"
          "$bin" --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 postgresql-client
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres nakama
      - name: Lua modules (syntax, Nakama load check, unit tests incl. signing test vectors)
        run: |
          luac5.1 -p server/nakama/modules/*.lua
          lua5.1 server/nakama/tests/tretu_test.lua
          server/nakama/nakama.sh check
      - name: Tretu integration test (fake issuer + platform, real Nakama, game client)
        env:
          TEST_DB: postgres:postgres@127.0.0.1:5432/nakama_test
          GODOT: godot
        run: node server/nakama/tests/tretu_integration.mjs
      - name: Start Nakama
        env:
          NAKAMA_ALLOW_DEFAULTS: "1"
          NAKAMA_DATABASE_ADDRESS: postgres:postgres@127.0.0.1:5432/nakama
        run: |
          nohup server/nakama/nakama.sh start > nakama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7350/healthcheck && break; sleep 2; done
          curl -sf http://127.0.0.1:7350/healthcheck
      - name: Server integration test
        env:
          GODOT_OK: "SERVER TEST DONE, 0 failures"
        run: tools/ci/godot.sh --headless --path game res://tests/net/server_test.tscn -- --require-server
      - name: Co-op network test
        env:
          GODOT_OK: "NET TEST DONE, 0 failures"
        run: tools/ci/godot.sh --headless --path game res://tests/net/net_test.tscn
      - name: Desync test (host + 3 clients)
        env:
          GODOT_OK: "DESYNC TEST DONE, 0 failures"
        run: tools/ci/godot.sh --headless --path game res://tests/net/desync_test.tscn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            nakama.log

  export:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: ["Windows Desktop", "macOS", "Web"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          echo "${GODOT_LINUX_SHA512}  Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" | sha512sum -c -
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          echo "${GODOT_TEMPLATES_SHA512}  Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" | sha512sum -c -
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/
      - name: Import
        run: godot --headless --path game --import || true
      - name: Point release builds at the live server
        if: vars.HOLLOWMERE_DOMAIN != ''
        run: sed -i "s/%HOLLOWMERE_DOMAIN%/${{ vars.HOLLOWMERE_DOMAIN }}/" game/project.godot
      # project.godot ships auth_issuer="https://auth.tretu.de" (the Tretu-Konto is the only account
      # sign-in); the TRETU_AUTH_ISSUER variable only overrides it, e.g. for a staging issuer.
      - name: Override the Tretu issuer (only with the TRETU_AUTH_ISSUER variable)
        if: vars.TRETU_AUTH_ISSUER != ''
        env:
          ISSUER: ${{ vars.TRETU_AUTH_ISSUER }}
        run: |
          [[ "$ISSUER" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "TRETU_AUTH_ISSUER must look like https://auth.tretu.de"; exit 1; }
          sed -i "s|^auth_issuer=\".*\"\$|auth_issuer=\"$ISSUER\"|" game/project.godot
          grep -q "^auth_issuer=\"$ISSUER\"" game/project.godot
      - name: Tretu sign-in is configured in the build
        run: grep -Eq '^auth_issuer="https://[A-Za-z0-9.-]+"$' game/project.godot && grep -q '^client_id="hollowmere"$' game/project.godot
      - name: Export
        run: |
          mkdir -p build/windows build/macos build/web
          set +e
          godot --headless --path game --export-release "${{ matrix.preset }}"
          code=$?
          set -e
          case "${{ matrix.preset }}" in
            "Windows Desktop") test -f build/windows/Hollowmere.exe ;;
            macOS) test -f build/macos/Hollowmere.zip ;;
            Web) test -f build/web/index.html ;;
          esac || exit "${code:-1}"
      - name: Fingerprint and precompress (web)
        if: matrix.preset == 'Web'
        run: |
          sudo apt-get install -y -qq brotli
          tools/release/fingerprint_web.sh build/web
          tools/release/precompress_web.sh build/web
          test -f build/web/robots.txt && test -f build/web/sitemap.xml
          test -f build/web/auth/callback/index.html && test -f build/web/datenschutz/index.html
      - name: Web download budget (< 50 MB)
        if: matrix.preset == 'Web'
        run: |
          total=$(cat build/web/*.br | wc -c)
          echo "Compressed download: $((total / 1048576)) MB"
          test "$total" -lt 52428800
      - uses: actions/upload-artifact@v4
        with:
          name: hollowmere-${{ matrix.preset == 'Windows Desktop' && 'windows' || matrix.preset == 'macOS' && 'macos' || 'web' }}
          path: build/

  sign-macos:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hollowmere-macos
          path: dist
      - name: Sign and notarize
        if: env.MACOS_SIGN_IDENTITY != ''
        run: tools/release/sign_macos.sh dist/macos/Hollowmere.zip
      - name: Unsigned build (no Apple secrets yet)
        if: env.MACOS_SIGN_IDENTITY == ''
        run: echo "::warning::macOS build is unsigned; add the Apple secrets listed in RELEASE.md"
      - uses: actions/upload-artifact@v4
        with:
          name: hollowmere-macos-release
          path: dist/macos/Hollowmere.zip

  itch:
    needs: [export, sign-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hollowmere-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: hollowmere-macos-release
          path: dist/mac
      - name: Push playtest builds to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          version="${GITHUB_REF_NAME#v}"
          ./butler push dist/windows "$ITCH_TARGET:windows" --userversion "$version"
          ./butler push dist/mac/Hollowmere.zip "$ITCH_TARGET:mac" --userversion "$version"
      - name: Skipped (no itch secrets yet)
        if: env.BUTLER_API_KEY == '' || env.ITCH_TARGET == ''
        run: echo "::warning::Set BUTLER_API_KEY (secret) and ITCH_TARGET (variable, e.g. you/hollowmere) to publish to itch.io"

  deploy-web:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hollowmere-web
          path: site
      - name: Upload to server and reload PM2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/srv/hollowmere' }}
          SITE_DIR: ${{ vars.DEPLOY_SITE_DIR || '/var/www/hollowmere/site' }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::Set DEPLOY_HOST and DEPLOY_SSH_KEY to deploy the web build (HOSTING.md)."
            exit 0
          fi
          mkdir -p ~/.ssh && echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete site/web/ "$DEPLOY_USER@$DEPLOY_HOST:$SITE_DIR/"
          # Server code: the checkout on the box follows the tag; PM2 runs migrations on start.
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -lc "'set -e; cd $APP_DIR && git fetch --tags --force origin && git checkout --detach $GITHUB_REF_NAME && server/nakama/nakama.sh check && pm2 reload ecosystem.config.cjs --update-env && pm2 save'"
          sleep 5
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "curl -sf http://127.0.0.1:8787/api/health"
