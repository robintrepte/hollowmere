<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="google-client-id" content="%GOOGLE_CLIENT_ID%">
	<meta name="apple-client-id" content="%APPLE_CLIENT_ID%">
	<meta name="discord-client-id" content="%DISCORD_CLIENT_ID%">
	<meta name="theme-color" content="#1c2120">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Hollowmere">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="icon-180.png">
	<link rel="icon" type="image/png" href="icon-192.png">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		html, body, #canvas { margin: 0; padding: 0; border: 0; }
		html, body { width: 100%; height: 100%; overscroll-behavior: none; }
		body { color: #f3ead8; background-color: #1c2120; overflow: hidden; touch-action: none; font-family: "Trebuchet MS", sans-serif;
			-webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
		#canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
		#canvas:focus { outline: none; }
		#status-install { margin-top: 22px; max-width: 320px; text-align: center; font-size: 13px; line-height: 1.5; color: #b9c8a8; display: none; }
		#status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1c2120; }
		#status-logo { font-size: 42px; letter-spacing: 2px; color: #ffd36b; text-shadow: 3px 3px 0 #6a3e1e; margin-bottom: 18px; }
		#status-sub { font-size: 14px; color: #b9c8a8; margin-bottom: 26px; }
		#status-progress { width: 280px; height: 14px; appearance: none; border: 2px solid #6a3e1e; background: #2c3330; border-radius: 7px; overflow: hidden; }
		#status-progress::-webkit-progress-bar { background: #2c3330; }
		#status-progress::-webkit-progress-value { background: linear-gradient(90deg, #8fe36b, #ffd36b); }
		#status-progress::-moz-progress-bar { background: linear-gradient(90deg, #8fe36b, #ffd36b); }
		#status-notice { margin-top: 18px; max-width: 420px; text-align: center; line-height: 1.5; color: #ffb4a0; display: none; }
		#status-legal { margin-top: 28px; font-size: 13px; }
		#status-legal a { color: #b9c8a8; margin: 0 0.4rem; }
		#gsi-holder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, 90px); display: none; z-index: 10; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<noscript>Hollowmere needs JavaScript to run.</noscript>
	<div id="status">
		<div id="status-logo">Hollowmere</div>
		<div id="status-sub">Waking up the Wildlings...</div>
		<progress id="status-progress"></progress>
		<div id="status-notice"></div>
		<div id="status-install"></div>
		<div id="status-legal"><a href="https://tretu.de/datenschutz" rel="privacy-policy">Datenschutz</a> · <a href="https://tretu.de/agb" rel="terms-of-service">AGB</a> · <a href="https://tretu.de/impressum">Impressum</a></div>
	</div>
	<div id="gsi-holder"></div>

	<script>
		// Size the canvas to the *visible* viewport (iOS home-screen apps report 100vh too tall,
		// which is what left black bars around the game). Godot then expands into that rectangle.
		function fitCanvas() {
			const c = document.getElementById("canvas");
			if (!c) return;
			const vv = window.visualViewport;
			const w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
			const h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
			c.style.width = w + "px";
			c.style.height = h + "px";
			c.style.left = (vv ? vv.offsetLeft : 0) + "px";
			c.style.top = (vv ? vv.offsetTop : 0) + "px";
		}
		fitCanvas();
		window.addEventListener("resize", fitCanvas);
		window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 250); });
		if (window.visualViewport) {
			visualViewport.addEventListener("resize", fitCanvas);
			visualViewport.addEventListener("scroll", fitCanvas);
		}

		// Phones: suggest installing to the home screen (full screen, own icon), and in a plain browser tab
		// go full screen on the first tap where the browser allows it (Android; iPhone Safari does not).
		(function () {
			const touch = matchMedia("(pointer: coarse)").matches;
			const installed = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone;
			if (!touch || installed) return;
			const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
			const hint = document.getElementById("status-install");
			hint.textContent = ios ? "Tip: tap Share, then \u201cAdd to Home Screen\u201d to play full screen."
				: "Tip: open the browser menu and choose \u201cAdd to Home screen\u201d or \u201cInstall app\u201d to play full screen.";
			hint.style.display = "block";
			const root = document.documentElement;
			if (!root.requestFullscreen) return;
			document.addEventListener("touchend", function goFull() {
				document.removeEventListener("touchend", goFull);
				root.requestFullscreen({ navigationUI: "hide" }).catch(function () {});
			});
		}());
		document.addEventListener("gesturestart", (e) => e.preventDefault());
		document.addEventListener("contextmenu", (e) => e.preventDefault());
	</script>
	<script>
		// Discord OAuth popup lands back on this page with #access_token=...
		(function () {
			const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
			const tok = h.get("access_token");
			if (tok && window.opener) {
				window.opener.hollowmereDiscordToken = tok;
				window.close();
			}
		}());

		function hmMeta(name) {
			const el = document.querySelector('meta[name="' + name + '"]');
			return el ? (el.content || "") : "";
		}

		window.hollowmereGoogleToken = "";
		window.hollowmereAppleToken = "";
		window.hollowmereDiscordToken = "";
		window.hollowmereGoogleSignIn = function () {
			const cid = hmMeta("google-client-id");
			if (!cid || cid.startsWith("%")) { window.hollowmereGoogleError = "Google sign-in is not configured."; return; }
			const go = () => {
				google.accounts.id.initialize({ client_id: cid, callback: (r) => { window.hollowmereGoogleToken = r.credential; document.getElementById("gsi-holder").style.display = "none"; } });
				const holder = document.getElementById("gsi-holder");
				holder.style.display = "block";
				google.accounts.id.renderButton(holder, { theme: "filled_black", size: "large", shape: "pill" });
				google.accounts.id.prompt();
			};
			if (window.google && google.accounts) { go(); return; }
			const s = document.createElement("script");
			s.src = "https://accounts.google.com/gsi/client";
			s.onload = go;
			document.head.appendChild(s);
		};
		window.hollowmereHideGoogle = function () { document.getElementById("gsi-holder").style.display = "none"; };

		window.hollowmereAppleSignIn = function () {
			const cid = hmMeta("apple-client-id");
			if (!cid || cid.startsWith("%")) { window.hollowmereAppleError = "Apple sign-in is not configured."; return; }
			const go = () => {
				AppleID.auth.init({ clientId: cid, scope: "name email", redirectURI: location.origin + "/", usePopup: true });
				AppleID.auth.signIn().then((r) => { window.hollowmereAppleToken = r.authorization.id_token; })
					.catch((e) => { window.hollowmereAppleError = (e && e.error === "popup_closed_by_user") ? "Cancelled." : "Apple sign-in failed."; });
			};
			if (window.AppleID) { go(); return; }
			const s = document.createElement("script");
			s.src = "https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js";
			s.onload = go;
			document.head.appendChild(s);
		};

		window.hollowmereDiscordSignIn = function () {
			const cid = hmMeta("discord-client-id");
			if (!cid || cid.startsWith("%")) { window.hollowmereDiscordError = "Discord sign-in is not configured."; return; }
			const redirect = location.origin + "/";
			const url = "https://discord.com/api/oauth2/authorize?client_id=" + encodeURIComponent(cid)
				+ "&response_type=token&redirect_uri=" + encodeURIComponent(redirect) + "&scope=identify";
			const pop = window.open(url, "hm-discord", "width=500,height=720");
			if (!pop) { window.hollowmereDiscordError = "The Discord sign-in popup was blocked."; }
		};

		// Tretu-Konto: OpenID Connect, authorization code + PKCE (S256), public client "hollowmere".
		// The game calls hollowmereTretuSignIn(issuer, clientId) and polls window.hollowmereTretuToken.
		// /auth/callback (web/auth/callback/index.html) relays {code, state} back here: through a
		// BroadcastChannel + storage event for the popup, or sessionStorage after a full-page redirect
		// (used when the popup is blocked). Popup state lives in localStorage only until it is used.
		(function () {
			const PENDING = "hm-tretu-pending", RESULT = "hm-tretu-result", MAX_AGE_MS = 15 * 60 * 1000;
			window.hollowmereTretuToken = "";
			window.hollowmereTretuError = "";
			window.hollowmereTretuName = "";
			window.hollowmereTretuResume = false;
			const b64url = (bytes) => btoa(String.fromCharCode.apply(null, Array.from(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
			const rnd = (n) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); };
			const s256 = async (v) => b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v))));
			const read = (store, k) => { try { return JSON.parse(store.getItem(k) || "null"); } catch (e) { return null; } };
			const claims = (jwt) => {
				try {
					const p = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
					const bin = atob(p + "===".slice((p.length + 3) % 4));
					return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
				} catch (e) { return {}; }
			};
			let busy = false;
			async function finish(res) {
				const p = read(localStorage, PENDING);
				if (busy || !p || !res || res.state !== p.state) return;
				busy = true;
				localStorage.removeItem(PENDING);
				try {
					if (Date.now() - (p.at || 0) > MAX_AGE_MS) throw new Error("expired");
					if (res.error) {
						window.hollowmereTretuError = res.error === "access_denied" ? "Tretu sign-in was cancelled." : "Tretu sign-in failed.";
						return;
					}
					const body = new URLSearchParams({ grant_type: "authorization_code", code: res.code, redirect_uri: p.redirect, client_id: p.clientId, code_verifier: p.verifier });
					const r = await fetch(p.tokenEndpoint, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded", Accept: "application/json" }, body: body });
					const t = await r.json().catch(() => ({}));
					if (!r.ok || !t.access_token) throw new Error("token");
					const c = t.id_token ? claims(t.id_token) : {};
					if (c.nonce && c.nonce !== p.nonce) throw new Error("nonce");
					window.hollowmereTretuName = c.preferred_username || "";
					window.hollowmereTretuToken = t.access_token;
				} catch (e) {
					window.hollowmereTretuError = "Tretu sign-in failed.";
				} finally {
					busy = false;
				}
			}
			window.hollowmereTretuSignIn = function (issuer, clientId) {
				window.hollowmereTretuToken = "";
				window.hollowmereTretuError = "";
				// Open the popup inside the click; it is pointed at the issuer once discovery is back.
				const pop = window.open("", "hm-tretu", "width=520,height=740");
				(async function () {
					try {
						const r = await fetch(issuer + "/.well-known/openid-configuration", { headers: { Accept: "application/json" } });
						const d = r.ok ? await r.json() : {};
						if ((d.issuer || "").replace(/\/$/, "") !== issuer || !d.authorization_endpoint || !d.token_endpoint) throw new Error("discovery");
						const verifier = rnd(48), state = rnd(16), nonce = rnd(16);
						const redirect = location.origin + "/auth/callback";
						localStorage.setItem(PENDING, JSON.stringify({ state, nonce, verifier, redirect, clientId, tokenEndpoint: d.token_endpoint, mode: pop ? "popup" : "redirect", at: Date.now() }));
						// No offline_access: the browser build never keeps a refresh token (the Nakama session is the login).
						const q = new URLSearchParams({ response_type: "code", client_id: clientId, redirect_uri: redirect, scope: "openid profile email tretu", state, nonce, code_challenge: await s256(verifier), code_challenge_method: "S256" });
						const url = d.authorization_endpoint + (d.authorization_endpoint.indexOf("?") >= 0 ? "&" : "?") + q.toString();
						if (pop) { pop.location.href = url; } else { location.assign(url); }
					} catch (e) {
						if (pop) pop.close();
						window.hollowmereTretuError = "Can't reach the Tretu sign-in right now.";
					}
				}());
			};
			if ("BroadcastChannel" in window) { new BroadcastChannel("hm-tretu").onmessage = (e) => finish(e.data); }
			window.addEventListener("storage", (e) => {
				if (e.key === RESULT && e.newValue) { localStorage.removeItem(RESULT); finish(read({ getItem: () => e.newValue }, RESULT)); }
			});
			// An abandoned sign-in must not leave its PKCE verifier or a code lying around.
			const stale = read(localStorage, PENDING);
			if (stale && Date.now() - (stale.at || 0) > MAX_AGE_MS) localStorage.removeItem(PENDING);
			localStorage.removeItem(RESULT);
			const back = read(sessionStorage, RESULT);
			if (back) {
				sessionStorage.removeItem(RESULT);
				window.hollowmereTretuResume = true;
				finish(back);
			}
		}());
	</script>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusNotice = document.getElementById('status-notice');

			function displayFailureNotice(err) {
				console.error(err);
				statusNotice.style.display = 'block';
				statusNotice.textContent = (err instanceof Error ? err.message : String(err));
				statusProgress.style.display = 'none';
			}

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length !== 0) {
				displayFailureNotice('Your browser is missing features needed to play: ' + missing.join(', ') + '. Try a recent Chrome, Firefox, Edge or Safari.');
				return;
			}
			engine.startGame({
				onProgress: function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(() => { statusOverlay.remove(); }, displayFailureNotice);
		}());
	</script>
</body>
</html>
